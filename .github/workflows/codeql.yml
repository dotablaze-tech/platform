name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

# Superseded PR pushes are cancelled; main and schedule runs queue so every
# default-branch commit still uploads its results.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          # javascript-typescript is omitted on purpose: the repo holds only Nx
          # config files, and the extractor fails the job when it sees no
          # source. Add it back once the first TS/JS source lands.
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # autobuild compiles the go.work modules, so the toolchain must match
      # the one the workspace declares rather than whatever the runner ships.
      - if: ${{ matrix.language == 'go' }}
        name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}
          # Content-hash cache keys never repeat and bloat the Actions cache.
          dependency-caching: false
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
