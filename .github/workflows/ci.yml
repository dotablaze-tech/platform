name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled main run could stop between the version tag push and the
  # image push, leaving a release with no image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  check:
    # GitHub-hosted only: the self-hosted ARC runner set is dormant.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # nx-set-shas looks up the last successful run of this workflow.
      actions: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Dependencies
        run: npm ci
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v4
      - if: ${{ github.event_name == 'pull_request' }}
        name: Setup Main Branch Tracking
        run: git branch --track main origin/main
      - name: Run Format Check
        run: npx nx-cloud record -- nx format:check
      - name: Reset NX
        run: npx nx reset
      - name: Run Linting, Unit, Component, & E2E Tests
        run: npx nx affected -t lint test component-test
      - name: Run E2E Tests
        run: npx nx affected -t e2e --parallel=1
      - name: Run Build
        run: npx nx affected -t build

  release:
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Setup SSH
        uses: MrSquaare/ssh-setup-action@v3
        with:
          host: github.com
          private-key: ${{ secrets.ACTIONS_PRIVATE_KEY }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # docker-container + QEMU replaces the kubernetes driver, which
          # only works from a runner inside the cluster.
          driver: 'docker-container'
          platforms: 'linux/amd64,linux/arm64'
      # Release commits and tags push over SSH as the org's machine user:
      # main's ruleset lets org admins bypass it, and GitHub refuses the
      # Actions integration as a bypass actor on org repository rulesets.
      # Unlike GITHUB_TOKEN pushes, these trigger CI, whose run then finds
      # only chore commits and releases nothing.
      - name: Push over SSH
        run: git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
      # The version target pushes a release commit to main. If main moved
      # since this run's commit, the push is rejected but its tags still land,
      # orphaning them. Releasing from the latest main shrinks that window to
      # the install and build below; the run queued for the newer commit then
      # finds nothing unreleased and does not bump.
      - name: Fast-forward to latest main
        run: git pull --ff-only origin main
      - name: Install Dependencies
        run: npm ci
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v4
      # build-image copies dist/ into the image, so the build must run in
      # this job rather than in check.
      - name: Run Build
        run: npx nx affected -t build
      - name: Run Version Upgrades
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          npx nx affected -t version --parallel=1
